<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Korea Post Shipping Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 480px;
    margin: auto;
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
  }
  h2 {
    text-align: center;
    color: #c40000;
    margin-bottom: 10px;
  }
  img {
    display: block;
    margin: auto;
    width: 160px;
    border-radius: 10px;
  }
  label {
    font-weight: bold;
    margin-top: 10px;
    display: block;
  }
  input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    margin-bottom: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #c40000;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }
  button:hover {
    background: #a00000;
  }
  #result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #003366;
    text-align: center;
  }
</style>
</head>

<body>
<div class="container">

  <!-- 우체국 로봇 이미지 (GitHub 내부 파일) -->
  <img src="assets/Poster.jpg" alt="Korea Post Robot">

  <!-- 언어 선택 -->
  <select id="lang" onchange="changeLang()">
    <option value="ko">한국어</option>
    <option value="en">English</option>
  </select>

  <h2 id="title">캐나다 → 한국 우체국택배 예상요금 계산기</h2>

  <label id="label-type">택배 종류</label>
  <select id="type">
    <option id="doc-option" value="doc">서류 (Documents)</option>
    <option id="parcel-option" value="parcel">일반 화물 (Parcel)</option>
  </select>

  <label id="label-weight">무게 (kg)</label>
  <input id="weight" type="number" step="0.01">

  <label id="label-length">가로 (cm)</label>
  <input id="length" type="number">

  <label id="label-width">세로 (cm)</label>
  <input id="width" type="number">

  <label id="label-height">높이 (cm)</label>
  <input id="height" type="number">

  <button id="calc-btn" onclick="calcPost()">예상 택배비 계산하기</button>

  <div id="result"></div>
</div>

    parcel: "일반 화물 (Parcel)",

    length: "가로 (cm)",

    height: "높이 (cm)",
    button: "예상 택배비 계산하기",
    resultWeight: "청구중량",
    resultFee: "예상 택배비"
  },
  en: {
    title: "Canada → Korea Korea Post Shipping Cost Calculator",
    type: "Package Type",
    doc: "Documents",
    parcel: "Parcel",
    weight: "Weight (kg)",
    length: "Length (cm)",

    height: "Height (cm)",

function changeLang() {
  const lang = document.getElementById("lang").value;

  document.getElementById("title").innerText = text[lang].title;
  document.getElementById("label-type").innerText = text[lang].type;
  document.getElementById("doc-option").innerText = text[lang].doc;
  document.getElementById("parcel-option").innerText = text[lang].parcel;
  document.getElementById("label-weight").innerText = text[lang].weight;
  document.getElementById("label-length").innerText = text[lang].length;
  document.getElementById("label-width").innerText = text[lang].width;
  document.getElementById("label-height").innerText = text[lang].height;
  document.getElementById("calc-btn").innerText = text[lang].button;
}
