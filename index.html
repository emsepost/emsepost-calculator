<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Korea Post Shipping Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 480px;
    margin: auto;
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
  }
  h2 {
    text-align: center;
    color: #c40000;
    margin-bottom: 10px;
  }
  img {
    display: block;
    margin: auto;
    width: 160px;
    border-radius: 10px;
  }
  label {
    font-weight: bold;
    margin-top: 10px;
    display: block;
  }
  input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    margin-bottom: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #c40000;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 5px;
  }
  button:hover {
    background: #a00000;
  }
  #bookBtn {
    background: #28a745;
    margin-top: 12px;
    display: none; /* Hidden until calculated */
  }
  #bookBtn:hover {
    background: #218838;
  }
  #result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #003366;
    text-align: center;
  }
  .footer-address {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: #666;
    border-top: 1px solid #eee;
    padding-top: 15px;
  }
</style>
</head>

<body>
<div class="container">

  <!-- 우체국 로봇 이미지 (GitHub 내부 파일) -->
  <img src="Poster.jpg" alt="Korea Post Robot">

  <!-- 언어 선택 -->
  <select id="lang" onchange="changeLang()">
    <option value="ko">한국어</option>
    <option value="en">English</option>
  </select>

  <h2 id="title">캐나다 → 한국 우체국택배 예상요금 계산기</h2>

  <label id="label-type">택배 종류</label>
  <select id="type">
    <option id="doc-option" value="doc">서류 (Documents)</option>
    <option id="parcel-option" value="parcel">일반 화물 (Parcel)</option>
  </select>

  <label id="label-weight">무게 (kg)</label>
  <input id="weight" type="number" step="0.01">

  <label id="label-length">가로 (cm)</label>
  <input id="length" type="number">

  <label id="label-width">세로 (cm)</label>
  <input id="width" type="number">

  <label id="label-height">높이 (cm)</label>
  <input id="height" type="number">

  <button id="calc-btn" onclick="calcPost()">예상 택배비 계산하기</button>

  <div id="result"></div>
  <button id="bookBtn" onclick="sendBookingEmail()">Book (Send Email)</button>

  <div class="footer-address">
    #161-7181 Yonge Street, Thornhill, ON L3T 0C7
  </div>
</div>

<script>
// 다국어 텍스트
const text = {
  ko: {
    title: "캐나다 → 한국 우체국택배 예상요금 계산기",
    type: "택배 종류",
    doc: "서류 (Documents)",
    parcel: "일반 화물 (Parcel)",
    weight: "무게 (kg)",
    length: "가로 (cm)",
    width: "세로 (cm)",
    height: "높이 (cm)",
    button: "예상 택배비 계산하기",
    bookButton: "Book (이메일 예약하기)",
    resultWeight: "청구중량",
    resultFee: "예상 택배비"
  },
  en: {
    title: "Canada → Korea Post Shipping Cost Calculator",
    type: "Package Type",
    doc: "Documents",
    parcel: "Parcel",
    weight: "Weight (kg)",
    length: "Length (cm)",
    width: "Width (cm)",
    height: "Height (cm)",
    button: "Calculate Estimated Shipping Cost",
    bookButton: "Book (Send Email)",
    resultWeight: "Chargeable Weight",
    resultFee: "Estimated Cost"
  }
};

let lastCalculationText = "";

function changeLang() {
  const lang = document.getElementById("lang").value;

  document.getElementById("title").innerText = text[lang].title;
  document.getElementById("label-type").innerText = text[lang].type;
  document.getElementById("doc-option").innerText = text[lang].doc;
  document.getElementById("parcel-option").innerText = text[lang].parcel;
  document.getElementById("label-weight").innerText = text[lang].weight;
  document.getElementById("label-length").innerText = text[lang].length;
  document.getElementById("label-width").innerText = text[lang].width;
  document.getElementById("label-height").innerText = text[lang].height;
  document.getElementById("calc-btn").innerText = text[lang].button;
  document.getElementById("bookBtn").innerText = text[lang].bookButton;
}

function calcPost() {
  const lang = document.getElementById("lang").value;
  let type = document.getElementById('type').value;
  const w = parseFloat(document.getElementById('weight').value);
  const L = parseFloat(document.getElementById('length').value);
  const W = parseFloat(document.getElementById('width').value);
  const H = parseFloat(document.getElementById('height').value);
  const bookBtn = document.getElementById('bookBtn');

  if (isNaN(w) || w <= 0) {
    alert(lang === "ko" ? "무게를 입력하세요." : "Please enter weight.");
    return;
  }

  // Document over 0.3Kg should be treated as regular parcel
  if (type === "doc" && w > 0.3) {
    type = "parcel";
  }

  // 서류는 무조건 25 CAD (0.3kg 이하일 때)
  if (type === "doc") {
    lastCalculationText = `Item Type: Document (서류)\nWeight: ${w.toFixed(2)} kg\nEstimated Cost: 25 CAD`;
    document.getElementById('result').innerHTML =
      `${text[lang].resultWeight}: ${w.toFixed(2)} kg<br>${text[lang].resultFee}: 25 CAD`;
    bookBtn.style.display = "block";
    return;
  }

  // 일반 화물 계산
  let wBox = w;
  if (w <= 2) wBox += 0.2;
  else if (w <= 5) wBox += 0.3;
  else if (w <= 8) wBox += 0.5;

  let wVol = null;
  if (!isNaN(L) && !isNaN(W) && !isNaN(H) && L > 0 && W > 0 && H > 0) {
    wVol = (L * W * H) / 5000;
  }

  let chargeWeight = wBox;
  if (wVol && wVol > wBox) chargeWeight = wVol;

  const rateTable = [
    {min: 0,   max: 0.5, fee: 30},
    {min: 0.51, max: 1,  fee: 35},
    {min: 1.01, max: 1.5, fee: 40},
    {min: 1.51, max: 2,  fee: 45},
    {min: 2.01, max: 2.5, fee: 55},
    {min: 2.51, max: 3,  fee: 65},
    {min: 3.01, max: 3.5, fee: 70},
    {min: 3.51, max: 4,  fee: 75},
    {min: 4.01, max: 4.5, fee: 80},
    {min: 4.51, max: 5,  fee: 85},
    {min: 5.01, max: 5.5, fee: 90},
    {min: 5.51, max: 6,  fee: 95},
    {min: 6.01, max: 6.5, fee: 100},
    {min: 6.51, max: 7,  fee: 105},
    {min: 7.01, max: 7.5, fee: 110},
    {min: 7.51, max: 8,  fee: 115},
    {min: 8.01, max: 8.5, fee: 120},
    {min: 8.51, max: 9,  fee: 125},
    {min: 9.01, max: 9.5, fee: 130},
    {min: 9.51, max: 10, fee: 135},
    {min: 10.01, max: 11, fee: 140},
    {min: 11.01, max: 12, fee: 145},
    {min: 12.01, max: 13, fee: 150},
    {min: 13.01, max: 14, fee: 155},
    {min: 14.01, max: 15, fee: 160},
    {min: 15.01, max: 16, fee: 165},
    {min: 16.01, max: 17, fee: 170},
    {min: 17.01, max: 18, fee: 175},
    {min: 18.01, max: 19, fee: 180},
    {min: 19.01, max: 20, fee: 185},
    {min: 20.01, max: 21, fee: 190}
  ];

  let matchedRate = rateTable.find(item => chargeWeight >= item.min && chargeWeight <= item.max);
  let fee = matchedRate ? matchedRate.fee : (lang === "ko" ? "기준 초과 (문의 바람)" : "Overweight (Contact Us)");

  let feeDisplay = typeof fee === 'number' ? fee + ' CAD' : fee;

  lastCalculationText = `Item Type: Regular Parcel (일반 화물)\nActual Weight: ${w.toFixed(2)} kg\nChargeable Weight: ${chargeWeight.toFixed(2)} kg\nEstimated Cost: ${feeDisplay}`;

  document.getElementById('result').innerHTML =
    `${text[lang].resultWeight}: ${chargeWeight.toFixed(2)} kg<br>${text[lang].resultFee}: ${feeDisplay}`;
  
  bookBtn.style.display = "block";
}

function sendBookingEmail() {
  const email = "emsepost@gmail.com";
  const subject = encodeURIComponent("New Shipment Booking Request");
  const body = encodeURIComponent(`Hello,\n\nI would like to book a shipment with the following details:\n\n${lastCalculationText}\n\nThank you!`);
  
  window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
}
</script>
</body>
</html>
